name: Crankset weight
description: Submit a measured or manufacturer-listed crankset weight with its exact configuration.
title: 'data(cranksets): add weight for '
body:
  - type: markdown
    attributes:
      value: |
        Read the [weight guidelines](https://github.com/drewfreyling/velogroupsets/blob/main/docs/weights-guidelines.md#cranksets) first. Prefer 170 mm reference cranks, but report the actual length you weighed or found in the source.
        This form opens an issue for review; it does not publish a weight automatically. Keep the bottom bracket out of the measurement and never calculate a crankset weight by subtracting an assumed bottom-bracket weight.
  - type: input
    id: component
    attributes:
      label: Component model and catalogue reference
      description: Give the exact model/revision and its component URL or stable ID. For an unlisted variant, say that it needs a new record and link its manufacturer specification.
      placeholder: FC-M6100-1 — shimano-fc-m6100-1
    validations:
      required: true
  - type: dropdown
    id: source_kind
    attributes:
      label: Source of this weight
      options:
        - My own measurement
        - Manufacturer specification or original dealer catalogue
    validations:
      required: true
  - type: input
    id: weight_g
    attributes:
      label: Weight in grams
      description: Enter a positive weight. Use only the precision supported by the scale or publication, and do not use packaged/shipping weight.
      placeholder: '730'
    validations:
      required: true
  - type: input
    id: crank_length_mm
    attributes:
      label: Crank length in millimetres
      description: Identify the actual reference length, not a list of available sizes.
      placeholder: '170'
    validations:
      required: true
  - type: input
    id: chainrings_teeth
    attributes:
      label: Every chainring tooth count
      description: Include all fitted chainrings, largest first. Note Biopace, round, aftermarket or other identifiable ring variants.
      placeholder: 46/36/26T, original Shimano SG rings
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Included hardware and component condition
      description: Describe both crank arms, all chainrings, spider, fixing bolts/cap, guards, power meter, washers or other included parts. For your own measurement, weigh a clean, dry assembly and describe its condition. State what the publication leaves unspecified for a manufacturer reference.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Measurement details or manufacturer evidence
      description: For your own measurement, give the date, scale resolution and how you weighed the complete crankset. For a manufacturer figure, give the exact official URL or original catalogue URL, PDF/printed page and the entries establishing the weight, crank length, ring teeth and bottom-bracket exclusion.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Configuration checks
      options:
        - label: The stated weight excludes the bottom bracket, and was not calculated by subtracting a bottom-bracket weight.
          required: true
        - label: I identified the actual crank length, every chainring tooth count and the included hardware or source limitations.
          required: true
