name: Terraform infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must have GitHub/HCP setup completed)
        type: choice
        required: true
        options: [staging, production]
        default: staging
      operation:
        description: Speculative plan, or an apply-capable plan for approval in HCP
        type: choice
        required: true
        options: [speculative-plan, plan-for-approval]
        default: speculative-plan

permissions:
  contents: read

# Reuse this group for future application releases to the same environment.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  queue:
    name: Queue remote plan (approval in HCP)
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Upload configuration and queue run
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: velogroupsets-${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          args=(--environment "$TARGET_ENVIRONMENT")
          if [[ "$OPERATION" == "speculative-plan" ]]; then
            args+=(--plan-only)
          fi
          python3 scripts/hcp_run.py "${args[@]}"
