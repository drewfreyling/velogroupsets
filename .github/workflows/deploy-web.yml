name: Deploy website

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment with an already-provisioned OpenTofu foundation
        type: choice
        required: true
        options: [staging, production]
        default: staging

permissions:
  contents: read

# The same release lock as OpenTofu, held across checks and approval.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  preflight:
    name: Check encrypted deployment outputs (read only)
    needs: checks
    if: ${{ github.ref == 'refs/heads/main' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ format('{0}-plan', inputs.environment) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install checksum-verified OpenTofu
        # Pinned linux_amd64 ZIP digest from the 1.13.9 release SHA256SUMS.
        # Keep this aligned with .opentofu-version; never skip verification.
        env:
          TOFU_ZIP_SHA256: bc44eb6b06446ba83bd4072114891987f590f66cca712737a7f1147c50c539ce
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 --output "$RUNNER_TEMP/opentofu.zip" https://github.com/opentofu/opentofu/releases/download/v1.13.9/tofu_1.13.9_linux_amd64.zip
          printf '%s  %s\n' "$TOFU_ZIP_SHA256" "$RUNNER_TEMP/opentofu.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opentofu"
          unzip -o "$RUNNER_TEMP/opentofu.zip" tofu -d "$RUNNER_TEMP/opentofu"
          echo "$RUNNER_TEMP/opentofu" >> "$GITHUB_PATH"
      - run: python3 -m pip install -r scripts/requirements-infra.txt
      - name: Validate existing state and bindings without infrastructure writes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TOFU_ENCRYPTION_PASSPHRASE: ${{ secrets.TOFU_ENCRYPTION_PASSPHRASE }}
        # Public readiness settings are validated again in the protected deploy job.
        run: python3 scripts/prepare_web_deploy.py
      - name: Remove generated binding configuration
        if: always()
        run: rm -f wrangler.generated.json

  deploy:
    name: Deploy Worker and static catalogue
    needs: [checks, preflight]
    if: ${{ github.ref == 'refs/heads/main' && needs.checks.result == 'success' && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'staging' && 'https://staging.velogroupsets.com' || 'https://velogroupsets.com' }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
      PUBLIC_SITE_OPERATOR: ${{ vars.PUBLIC_SITE_OPERATOR || 'Drew Freyling' }}
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL || 'contact@velogroupsets.com' }}
      CONTACT_READY: ${{ vars.CONTACT_READY }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      UPLOADS_ENABLED: ${{ vars.UPLOADS_ENABLED }}
      CSAM_SCANNING_CONFIRMED: ${{ vars.CSAM_SCANNING_CONFIRMED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install checksum-verified OpenTofu
        # Pinned linux_amd64 ZIP digest from the 1.13.9 release SHA256SUMS.
        # Keep this aligned with .opentofu-version; never skip verification.
        env:
          TOFU_ZIP_SHA256: bc44eb6b06446ba83bd4072114891987f590f66cca712737a7f1147c50c539ce
        run: |
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 --output "$RUNNER_TEMP/opentofu.zip" https://github.com/opentofu/opentofu/releases/download/v1.13.9/tofu_1.13.9_linux_amd64.zip
          printf '%s  %s\n' "$TOFU_ZIP_SHA256" "$RUNNER_TEMP/opentofu.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/opentofu"
          unzip -o "$RUNNER_TEMP/opentofu.zip" tofu -d "$RUNNER_TEMP/opentofu"
          echo "$RUNNER_TEMP/opentofu" >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund
      - run: python3 -m pip install -r scripts/requirements-infra.txt
      - name: Build exact approved commit
        env:
          SITE_URL: ${{ inputs.environment == 'staging' && 'https://staging.velogroupsets.com' || 'https://velogroupsets.com' }}
        run: npm run build
      - name: Read existing infrastructure bindings privately
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TOFU_ENCRYPTION_PASSPHRASE: ${{ secrets.TOFU_ENCRYPTION_PASSPHRASE }}
        run: python3 scripts/prepare_web_deploy.py
      - name: Apply backward-compatible community migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ccb67114ff0fa1a13cb46ef3d08cb49
        run: npx --no-install wrangler d1 migrations apply COMMUNITY_DB --remote --config wrangler.generated.json
      - name: Configure community Worker secrets privately
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ccb67114ff0fa1a13cb46ef3d08cb49
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          MODERATOR_EMAILS: ${{ secrets.MODERATOR_EMAILS }}
          PHOTO_CACHE_PURGE_TOKEN: ${{ secrets.PHOTO_CACHE_PURGE_TOKEN }}
        run: python3 scripts/configure_worker_secrets.py
      - name: Deploy code and assets with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ccb67114ff0fa1a13cb46ef3d08cb49
        run: npx --no-install wrangler deploy --config wrangler.generated.json
      - name: Remove generated binding configuration
        if: always()
        run: rm -f wrangler.generated.json
