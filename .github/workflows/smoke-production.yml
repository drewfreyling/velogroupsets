name: Verify live production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Live production browser checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify TLS 1.3 and reject TLS 1.2 at the public edge
        shell: bash
        run: |
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
            --tlsv1.3 --tls-max 1.3 --dump-header "$RUNNER_TEMP/https.headers" \
            --output /dev/null https://velogroupsets.com/
          grep -Eqi '^strict-transport-security:.*max-age=31536000' "$RUNNER_TEMP/https.headers"
          grep -Eqi '^strict-transport-security:.*includeSubDomains' "$RUNNER_TEMP/https.headers"
          grep -Eqi '^strict-transport-security:.*preload' "$RUNNER_TEMP/https.headers"
          if curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
            --tlsv1.2 --tls-max 1.2 --output /dev/null https://velogroupsets.com/ 2> "$RUNNER_TEMP/tls12.log"; then
            echo '::error::Production accepted TLS 1.2; expected TLS 1.3 only.'
            exit 1
          else
            tls12_status=$?
          fi
          test "$tls12_status" -eq 35
          grep -qi 'alert protocol version' "$RUNNER_TEMP/tls12.log"
      - name: Verify the deployed catalogue and disabled community routes
        run: npx --no-install playwright test --config playwright.live.config.mjs --workers=2
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-production-failures-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
